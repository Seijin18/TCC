[platformio]
; Define o diretório raiz como base, para podermos acessar todos os subprojetos
src_dir = .
include_dir = shared

[esp32_common]
; Configurações comuns aos nós ESP32 (não é um [env], não roda sozinho —
; cada [env:xxx] de hardware herda daqui via "extends"). Mantido separado
; de [env:native_test], que não usa ESP32/Arduino/RF24.
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    nrf24/RF24 @ ^1.4.8
build_flags =
    -I shared

[env:mestre]
extends = esp32_common
; Compila APENAS a pasta do mestre
build_src_filter = -<*> +<mestre/src/>

[env:escravo]
extends = esp32_common
; Compila APENAS a pasta do escravo
build_src_filter = -<*> +<escravo/src/>

[env:jammer]
extends = esp32_common
; Compila APENAS a pasta do jammer
build_src_filter = -<*> +<jammer/src/>

[env:test_jammer]
extends = esp32_common
; Compila nosso novo ambiente de teste físico de antenas
build_src_filter = -<*> +<Tests/TestJammer/>

[env:analisador]
extends = esp32_common
; Compila APENAS a pasta do analisador
build_src_filter = -<*> +<analisador/src/>

[env:validacao]
extends = esp32_common
; Jammer (VSPI) + Analisador (HSPI) no mesmo ESP32, 2 antenas
build_src_filter = -<*> +<validacao/src/>

[env:placa_a]
extends = esp32_common
; two-board-topology: mestre (VSPI, loop() padrao) + analisador (HSPI, task
; FreeRTOS no core 0) na mesma placa. Reaproveita mestre/src/node.h e
; analisador/src/node.h via include relativo, sem duplicar logica.
build_src_filter = -<*> +<placa_a/src/>

[env:placa_b]
extends = esp32_common
; two-board-topology: escravo (VSPI, loop() padrao) + jammer (HSPI, task
; FreeRTOS no core 0) na mesma placa. Reaproveita escravo/src/node.h e
; jammer/src/node.h via include relativo, sem duplicar logica.
build_src_filter = -<*> +<placa_b/src/>

[env:native_test]
; Testes unitarios de logica pura (shared/hopping.h), rodando no host via
; gcc, sem hardware nem framework Arduino. Nao compila nenhum src/ dos
; nos (mestre/escravo/jammer/... dependem de RF24 e Arduino.h) — só os
; arquivos em test/. Não usa "extends = esp32_common" de propósito.
; Rodar com: pio test -e native_test
platform = native
build_flags = -I shared -std=gnu++14
